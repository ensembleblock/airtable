# Publishes a release when a maintainer pushes a version tag (e.g. v0.1.0).
# See RELEASING.md for the full process.
#
# 1. build           Verify the tag, run every check, pack & smoke-test the tarball.
# 2. publish         Stage that exact tarball on npm via trusted publishing (OIDC).
#                    A maintainer then approves it with 2FA: `npm stage approve`.
# 3. github-release  Create a *draft* GitHub Release with notes from CHANGELOG.md.
#                    The maintainer publishes it after approving the npm stage.
#
# The npm trusted publisher is bound to this filename (release.yml) and the
# `npm` environment. Renaming either breaks publishing until npm is updated.

name: Release

on:
  push:
    tags:
      - "v*.*.*"

# Every job declares the permissions it needs; nothing is granted by default.
permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    # An explicit `bash` adds `-o pipefail` (the implicit default doesn't).
    shell: bash

jobs:
  build:
    name: Verify, test & pack
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Full history, so we can check that the tagged commit is on main.
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.x
          # No dependency cache when building a release.
          package-manager-cache: false

      - name: Verify tag, version, branch & changelog
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="$(node -p 'require("./package.json").version')"
          name="$(node -p 'require("./package.json").name')"

          if [[ "$TAG" != "v$version" ]]; then
            echo "::error::Tag $TAG does not match package.json version $version."
            exit 1
          fi

          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Tagged commit $GITHUB_SHA is not on main."
            exit 1
          fi

          if npm view "$name@$version" version > /dev/null 2>&1; then
            echo "::error::$name@$version is already published on npm."
            exit 1
          fi

          heading="$(grep -m 1 "^## $version " CHANGELOG.md || true)"
          if [[ -z "$heading" || "$heading" == *unreleased* ]]; then
            echo "::error::CHANGELOG.md needs a dated '## $version (YYYY-MM-DD)' heading."
            exit 1
          fi

      - run: npm ci
      # Lint, format, typecheck & tests with coverage thresholds.
      - run: npm run check

      # `npm pack` runs the `prepare` build from a clean checkout.
      - name: Pack
        run: |
          mkdir -p "$RUNNER_TEMP/release"
          npm pack --pack-destination "$RUNNER_TEMP/release"
      - run: scripts/test-package.sh --tarball "$RUNNER_TEMP"/release/*.tgz

      - name: Extract release notes from CHANGELOG.md
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#v}"
          notes="$RUNNER_TEMP/release/notes.md"

          # Everything between "## <version> ..." and the next "## " heading.
          awk -v v="$version" '
            index($0, "## " v " ") == 1 { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > "$notes"

          if [[ -z "$(tr -d '[:space:]' < "$notes")" ]]; then
            echo "::error::No release notes found for $version in CHANGELOG.md."
            exit 1
          fi

          printf '\n---\n\nnpm: https://www.npmjs.com/package/@ensembleblock/airtable/v/%s\n' "$version" >> "$notes"

      - name: Summary
        run: |
          {
            echo "### Package"
            echo '```'
            tar -tzf "$RUNNER_TEMP"/release/*.tgz | LC_ALL=C sort
            echo '```'
            echo "sha256: \`$(sha256sum "$RUNNER_TEMP"/release/*.tgz | cut -d ' ' -f 1)\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: |
            ${{ runner.temp }}/release/*.tgz
            ${{ runner.temp }}/release/notes.md
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Stage on npm
    needs: build
    runs-on: ubuntu-latest
    # Only `v*` tags may deploy to this environment (configured in GitHub).
    environment: npm
    permissions:
      # Mint the OIDC token that npm trusted publishing exchanges for a
      # short-lived publish credential. No npm token is stored anywhere.
      id-token: write
    steps:
      # No checkout and no `npm ci`: no project or dependency code runs in the
      # job that can mint the OIDC token. It only publishes the tested tarball.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.x
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      # Trusted publishing needs npm >= 11.5.1; `npm stage` needs >= 11.15.0.
      - name: Check npm version
        run: |
          npm --version
          node -e '
            const [a, b] = process.argv[1].split(".").map(Number);
            if (a < 11 || (a === 11 && b < 15)) {
              console.error("::error::npm >= 11.15.0 is required for npm stage publish.");
              process.exit(1);
            }
          ' "$(npm --version)"

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: ${{ runner.temp }}/release

      # Provenance is generated automatically under trusted publishing.
      - name: npm stage publish
        run: |
          npm stage publish "$RUNNER_TEMP"/release/*.tgz --access public --ignore-scripts 2>&1 \
            | tee "$RUNNER_TEMP/stage.log"
          {
            echo "### Staged on npm — awaiting approval"
            echo '```'
            cat "$RUNNER_TEMP/stage.log"
            echo '```'
            echo 'Approve with 2FA: `npm stage list @ensembleblock/airtable`, then `npm stage approve <stage-id>`.'
          } >> "$GITHUB_STEP_SUMMARY"

  github-release:
    name: Draft GitHub Release
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: ${{ runner.temp }}/release

      # A draft, because the npm version isn't live until it's approved.
      # Safe to re-run: an existing release (draft or not) is left alone.
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "Release $TAG already exists; leaving it unchanged."
            exit 0
          fi

          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --draft \
            --title "$TAG" \
            --notes-file "$RUNNER_TEMP/release/notes.md"
